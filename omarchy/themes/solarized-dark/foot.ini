[colors-dark]
foreground=839496
background=002b36
# Blur only applies while the background is see-through, as with Glassy windows,
# and foot reads it only at launch, so it is on from the start.
blur=yes
selection-foreground=93a1a1
selection-background=073642

# Solarized Xresources: cursor base1
cursor=002b36 93a1a1

# Solarized canonical: 0=base02, 7=base2
regular0=073642
regular1=dc322f
regular2=859900
regular3=b58900
regular4=268bd2
regular5=d33682
regular6=2aa198
regular7=eee8d5

# 8 stays base01 (canonical base03 equals the background and hides dim text);
# brights keep hues, with Solarized's orange (9) and violet (13).
bright0=586e75
bright1=cb4b16
bright2=859900
bright3=b58900
bright4=268bd2
bright5=6c71c4
bright6=2aa198
bright7=fdf6e3
